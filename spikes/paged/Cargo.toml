[package]
name = "paged-spike"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = false

[features]
# The perf harness's phase clocks and counting allocator.
profile = ["rune/frame-profile", "dep:procwatch", "dep:wgpu"]

[dependencies]
rune = { path = "../../crates/rune", features = ["keys-overlay"] }
procwatch = { path = "../../crates/procwatch", optional = true }
wgpu = { version = "~30.0.1", default-features = false, optional = true }

[[bin]]
name = "paged"
path = "src/main.rs"

[[bin]]
name = "paged-perf"
path = "src/bin/perf.rs"
required-features = ["profile"]

[lints]
workspace = true
